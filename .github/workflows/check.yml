# GitHub Actions — проверки должны быть зелёными, чтобы деплой вообще начинался.

name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymix
          POSTGRES_PASSWORD: gymix
          POSTGRES_DB: gymix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymix -d gymix_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: типы и тесты
        run: pnpm check

      - name: сборка сервера и клиента
        run: pnpm build

      - name: сервер на PostgreSQL
        run: pnpm --filter @gymix/server test
        env:
          TEST_DATABASE_URL: postgres://gymix:gymix@localhost:5432/gymix_test

  e2e:
    # Браузерные сценарии работают на локальной PGlite с заглушкой API,
    # поэтому PostgreSQL и сервер здесь не нужны.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: установить Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: браузерные сценарии
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
